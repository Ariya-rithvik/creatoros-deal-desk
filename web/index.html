<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CreatorOS Deal Desk</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#15181d; --muted:#5d6672; --line:#e3e6ea; --accent:#3b5bdb; --accent-ink:#ffffff;
  --low:#1f8a4c; --low-bg:#e6f5ec; --med:#a86a00; --med-bg:#fff3d9; --high:#c0362c; --high-bg:#fde8e6; --dne:#7a1414; --dne-bg:#fbd9d6;
  --ok:#1f8a4c; --info:#5d6672; --warn:#a86a00; --bad:#c0362c;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#12151a; --panel:#1a1e25; --ink:#e8ebef; --muted:#9aa4b1; --line:#2a303a; --accent:#7c93ff; --accent-ink:#0d1020;
    --low:#4cc38a; --low-bg:#123324; --med:#f0b44c; --med-bg:#3a2b0d; --high:#ff7b70; --high-bg:#3d1714; --dne:#ff9a90; --dne-bg:#4a1512;
    --ok:#4cc38a; --info:#9aa4b1; --warn:#f0b44c; --bad:#ff7b70; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px;position:sticky;top:0;height:100vh;overflow:auto}
main{padding:24px 28px 80px;max-width:1040px}
h1{font-size:18px;margin:0 0 2px} h2{font-size:16px;margin:0 0 10px} h3{font-size:13px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tag{color:var(--muted);font-size:13px;margin:0 0 18px}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--accent)} button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--high);border-color:var(--high)}
.offer{display:block;width:100%;text-align:left;margin:0 0 8px;padding:10px 12px;border-radius:10px}
.offer.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.offer small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px;border:1px solid transparent}
.pill.LOW{color:var(--low);background:var(--low-bg)} .pill.MEDIUM{color:var(--med);background:var(--med-bg)}
.pill.HIGH{color:var(--high);background:var(--high-bg)} .pill.DO_NOT_ENGAGE{color:var(--dne);background:var(--dne-bg)}
.pill.SUPPORTED,.pill.SITE_CITES_EVIDENCE{color:var(--low);background:var(--low-bg)}
.pill.SELF_CLAIM{color:var(--med);background:var(--med-bg)}
.pill.UNSUPPORTED,.pill.UNSUBSTANTIATED{color:var(--high);background:var(--high-bg)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0 0 14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:13px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:13px/1.45 ui-monospace,Consolas,monospace;margin:8px 0 0;max-height:260px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px} td,th{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top;text-align:left} th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
.trace{list-style:none;margin:0;padding:0} .trace li{display:flex;gap:10px;padding:5px 0;border-top:1px dashed var(--line)} .trace li:first-child{border-top:0}
.trace .ag{width:130px;font-weight:600;flex:none} .trace .ms{width:60px;color:var(--muted);text-align:right;flex:none}
.flag{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)} .flag:first-child{border-top:0}
.sev{flex:none;width:64px;font-size:11px;font-weight:700} .sev.HIGH{color:var(--high)} .sev.MEDIUM{color:var(--warn)} .sev.LOW{color:var(--info)}
.sig.ok{color:var(--ok)} .sig.warn{color:var(--warn)} .sig.bad{color:var(--bad);font-weight:600} .sig.info{color:var(--info)}
.ev{font-size:12px;color:var(--muted);margin-top:3px} .rw{font-size:13px;margin-top:4px;padding:6px 8px;background:var(--bg);border-radius:6px}
.verdict{border-left:6px solid var(--muted)} .verdict.LOW{border-left-color:var(--low)} .verdict.MEDIUM{border-left-color:var(--med)} .verdict.HIGH{border-left-color:var(--high)} .verdict.DO_NOT_ENGAGE{border-left-color:var(--dne)}
.line{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line)} .line:first-child{border-top:0}
.line .t{flex:none;width:86px;color:var(--muted);font:12px ui-monospace,Consolas,monospace;padding-top:2px}
.line .k{flex:none;width:78px;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);padding-top:3px}
.line.placeholder .x{background:var(--med-bg);color:var(--med);padding:2px 6px;border-radius:4px}
.tabs{display:flex;gap:6px;margin:0 0 16px} .tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
textarea{width:100%;min-height:120px;font:13px ui-monospace,Consolas,monospace;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.hint{padding:10px 12px;border-radius:8px;background:var(--med-bg);color:var(--med);font-size:13px}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
label.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
@media (max-width:820px){.app{grid-template-columns:1fr} aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)} main{padding:18px 16px 60px}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>CreatorOS</h1>
    <p class="tag">Deal Desk: your AI team behind every sponsorship.</p>
    <div class="row" style="margin-bottom:12px">
      <button id="btnSamples" class="primary">Load sample offers</button>
      <button id="btnReset" title="Clear offers, ledger and trust graph">Reset</button>
    </div>
    <div id="inbox"></div>
    <h3 style="margin-top:18px">Paste an offer</h3>
    <textarea id="paste" placeholder="From: ...&#10;Subject: ...&#10;&#10;Hi, we'd love you to promote ..."></textarea>
    <div class="row" style="margin-top:8px"><button id="btnAdd">Add to inbox</button></div>
    <p class="small muted" style="margin-top:14px">Sample brands and sites are fictional demo fixtures. Real sites are crawled live.
      Nothing is ever sent or published automatically.</p>
  </aside>
  <main>
    <div class="tabs"><button id="tabDesk" class="on">Deal Desk</button><button id="tabMem">Creator Memory</button></div>
    <div id="desk"><div class="empty">Load the sample offers, or paste one, then select it.</div></div>
    <div id="mem" hidden></div>
  </main>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let offers = [], cur = null, report = null, offerFull = null;

async function api(path, method='GET', body){
  const r = await fetch(path, {method, headers: Object.assign({'X-CreatorOS': '1'}, body ? {'Content-Type':'application/json'} : {}), body: body ? JSON.stringify(body) : undefined});
  const data = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(data.detail || r.statusText);
  return data;
}
const LEVEL_TEXT = {LOW:'Looks clean', MEDIUM:'Counter first', HIGH:'Do not accept as written', DO_NOT_ENGAGE:'Do not engage'};

async function loadState(){
  const s = await api('/api/state'); offers = s.offers; renderInbox();
}
function renderInbox(){
  $('#inbox').innerHTML = offers.length ? offers.map(o => `
    <button class="offer ${o.id===cur?'sel':''}" data-id="${esc(o.id)}">
      <div class="row spread"><b>${esc(o.brand || 'Unknown brand')}</b>${o.risk?`<span class="pill ${esc(o.risk)}">${esc(o.risk.replace(/_/g,' '))}</span>`:''}</div>
      <small>${esc(o.label)}</small><small>${esc(o.sender)}</small>
      ${o.decision?`<small>Decision: ${esc(o.decision)}</small>`:''}
    </button>`).join('') : '<p class="small muted">Inbox is empty.</p>';
  document.querySelectorAll('.offer').forEach(b => b.onclick = () => select(b.dataset.id));
}
async function select(id){
  cur = id; offerFull = await api('/api/offers/' + id); report = offerFull.report; renderInbox(); renderDesk();
}
function renderDesk(){
  const o = offerFull; if(!o) return;
  const p = o.parsed;
  let h = `<div class="card"><div class="row spread"><div><h2>${esc(o.label)}</h2><div class="muted small">From ${esc(p.sender)}</div></div>
    <button id="btnCheck" class="primary">${report?'Re-run check':'Run Deal Desk check'}</button></div>
    <details style="margin-top:10px"><summary class="small muted">Show original message</summary><pre>${esc(o.raw)}</pre></details></div>`;
  h += `<div id="traceBox"></div>`;
  if(report) h += renderReport(o);
  $('#desk').innerHTML = h;
  $('#btnCheck').onclick = runCheck;
  if(report){ wireReport(o); }
}
async function runCheck(){
  const btn = $('#btnCheck'); btn.disabled = true; btn.textContent = 'Agents working...';
  const box = $('#traceBox');
  box.innerHTML = `<div class="card"><h3>Agents</h3><ul class="trace"><li><span class="ag">Explorer</span><span>Crawling the brand website in a real browser...</span></li></ul></div>`;
  try{
    report = await api(`/api/offers/${cur}/check`, 'POST');
    offerFull = await api('/api/offers/' + cur);
    await loadState();
    // reveal the trace step by step so the work is visible
    const items = report.trace; let shown = [];
    for(const t of items){ shown.push(t); box.innerHTML = traceHtml(shown); await new Promise(r => setTimeout(r, 140)); }
    renderDesk(); $('#traceBox').innerHTML = traceHtml(items);
  }catch(e){ box.innerHTML = `<div class="card hint">${esc(e.message)}</div>`; btn.disabled = false; btn.textContent = 'Run Deal Desk check'; }
}
function traceHtml(items){
  return `<div class="card"><h3>Agents</h3><ul class="trace">${items.map(t => `<li><span class="ag">${esc(t.agent)}</span><span class="ms">${esc(t.ms)} ms</span><span>${esc(t.summary)}</span></li>`).join('')}</ul></div>`;
}
function renderReport(o){
  const r = report, lv = r.risk.level;
  let h = `<div class="card verdict ${esc(lv)}"><div class="row spread"><div><span class="pill ${esc(lv)}">${esc(lv.replace(/_/g,' '))}</span>
      <b style="margin-left:8px">${esc(LEVEL_TEXT[lv])}</b> <span class="muted small">risk score ${esc(r.risk.score)}</span></div></div>
    <p style="margin:10px 0 6px">${esc(r.risk.recommended_action)}</p>
    <details><summary class="small muted">Why (${r.risk.reasons.length} reasons)</summary><table><tr><th>Source</th><th>Reason</th><th>Points</th></tr>
    ${r.risk.reasons.map(x => `<tr><td>${esc(x.source)}</td><td>${esc(x.text)}</td><td>${esc(x.points)}</td></tr>`).join('')}</table></details></div>`;

  h += `<div class="card"><h3>Sender and links</h3>${r.sender.flags.length ? r.sender.flags.map(f => `<div class="flag"><span class="sev ${esc(f.severity)}">${esc(f.severity)}</span>
      <div><b>${esc(f.title)}</b><div class="small">${esc(f.why)}</div><div class="ev">Evidence: ${esc(f.evidence)}</div></div></div>`).join('')
      : `<div class="sig ok">No red flags. ${esc((r.sender.notes||[]).join(' '))}</div>`}</div>`;

  const s = r.site;
  h += `<div class="card"><h3>Brand website (${s.ok ? esc(s.pages.length)+' pages, '+esc(r.site_fact_count)+' facts, '+esc(s.mode) : (s.skipped ? 'not visited' : 'not checked')})</h3>
    ${s.fixture ? '<div class="small muted">Demo fixture: a fictional site served locally.</div>' : ''}
    ${s.ok ? (s.signals||[]).map(x => `<div class="sig ${esc(x.level)} small">${x.level==='ok'?'&#10003;':x.level==='bad'?'&#10007;':'&bull;'} ${esc(x.text)}</div>`).join('') : `<div class="sig warn">${esc(s.error)}</div>`}</div>`;

  h += `<div class="card"><h3>Claims the brand wants you to make (${r.claims.length})</h3>${r.claims.length ? `<table><tr><th style="width:150px">Status</th><th>Claim and evidence</th></tr>
    ${r.claims.map(c => `<tr><td><span class="pill ${esc(c.status)}">${esc(c.status.replace(/_/g,' '))}</span></td><td>"${esc(c.text)}"
      <div class="small muted">${esc(c.reason)}</div>
      ${(c.evidence||[]).slice(0,1).map(e => `<div class="ev">Site says: "${esc(e.text)}" (fact ${esc(e.fact_id)})</div>`).join('')}
      ${c.rewrite ? `<div class="rw"><b>${esc(c.rewrite.action)}:</b> ${c.rewrite.text ? esc(c.rewrite.text) : ''} <span class="muted">${esc(c.rewrite.note)}</span></div>` : ''}</td></tr>`).join('')}</table>`
      : '<div class="muted small">No product claims found in the offer.</div>'}</div>`;

  const ta = r.terms_analysis, t = r.terms;
  if(lv === 'DO_NOT_ENGAGE'){ h += `<div class="card"><h3>Terms vs your norms</h3><div class="small muted">Not assessed: the sender looks unsafe, so the commercial terms do not matter.</div></div>`; }
  else h += `<div class="card"><h3>Terms vs your norms</h3><div class="small muted">Offer: ${esc(t.amount_raw||'fee not stated')} for ${esc(t.deliverable||'deliverable not stated')}.</div>
    ${ta.issues.length ? `<table><tr><th>Term</th><th>Offered</th><th>Your norm</th><th>What to ask</th></tr>${ta.issues.map(i => `<tr><td><span class="sev ${esc(i.severity)}">${esc(i.severity)}</span> ${esc(i.term)}</td><td>${esc(i.offered)}</td><td>${esc(i.norm)}</td><td>${esc(i.ask)}</td></tr>`).join('')}</table>` : ''}
    ${ta.ok.map(x => `<div class="sig ok small">&#10003; ${esc(x)}</div>`).join('')}
    <div class="small muted" style="margin-top:8px">Brand fit: ${esc(r.fit.label)} ${r.fit.reasons.length ? '- ' + esc(r.fit.reasons.join(' ')) : ''}</div></div>`;

  if(r.reply_draft.text) h += `<div class="card"><h3>Draft reply (never sent automatically)</h3><pre>${esc(r.reply_draft.text)}</pre></div>`;

  const d = o.decision;
  const risky = lv === 'DO_NOT_ENGAGE' || lv === 'HIGH';
  h += `<div class="card"><h3>Your decision</h3>${d ? `<div><b>Recorded: ${esc(d.decision)}</b> ${d.override?'<span class="pill HIGH">OVERRIDE</span>':''} <span class="muted small">ledger entry #${esc(d.ledger_seq)}</span></div>`
    : `<div class="row"><button id="bAccept" class="primary">Accept</button><button id="bCounter">Counter</button><button id="bDecline" class="danger">Decline</button></div>
       ${risky ? `<label class="chk small"><input type="checkbox" id="ovr"> <span>I understand this is rated ${esc(lv.replace(/_/g,' '))} and want to accept anyway (recorded in the ledger).</span></label>` : ''}
       <div id="decErr" class="small" style="color:var(--bad);margin-top:6px"></div>`}</div>`;

  if(o.campaign) h += renderCampaign(o);
  return h;
}
function renderCampaign(o){
  const c = o.campaign;
  let h = `<div class="card"><h2>Campaign: ${esc(c.brand)}</h2>
    <div class="row small muted"><span>${esc(c.deliverable||'deliverable not stated')}</span><span>&middot; ${esc(c.fee||'fee not stated')}</span><span>&middot; deadline ${esc(c.deadline||'not stated')}${c.days_left!=null?' ('+esc(c.days_left)+' days)':''}</span></div>
    <h3 style="margin-top:14px">Disclosure and compliance checklist</h3>
    ${c.disclosure_checklist.map(x => `<label class="chk small"><input type="checkbox"> <span>${esc(x.text)}</span></label>`).join('')}
    <h3 style="margin-top:14px">Approved claims (verified on the brand's own site)</h3>
    ${c.approved_claims.length ? c.approved_claims.map(a => `<div class="small">&#10003; ${esc(a.text)}</div>`).join('') : '<div class="small muted">None yet.</div>'}
    ${c.held_back.length ? `<h3 style="margin-top:14px">Held back</h3>${c.held_back.map(a => `<div class="small"><span class="pill ${esc(a.status)}">${esc(a.status)}</span> ${esc(a.text)}</div>`).join('')}` : ''}
    ${c.open_questions.length ? `<h3 style="margin-top:14px">Open questions for the brand</h3>${c.open_questions.map(q => `<div class="small">&bull; ${esc(q)}</div>`).join('')}` : ''}
    <p class="small muted" style="margin-top:12px">${esc(c.note)}</p>
    <div class="row" style="margin-top:8px"><button id="bScript" class="primary">Draft sponsor segment in my voice</button></div><div id="scriptBox"></div></div>`;
  return h;
}
function renderScript(s, held){
  return `<div style="margin-top:14px"><h3>Sponsor segment (${esc(s.estimated_seconds)}s, target ${esc(s.target_seconds)}s)</h3>
    ${s.lines.map(l => `<div class="line ${l.placeholder?'placeholder':''}"><span class="t">${esc(l.start)}-${esc(l.end)}s</span><span class="k">${esc(l.kind)}</span>
      <div><span class="x">${esc(l.text)}</span>${l.source ? `<div class="ev">Source: "${esc(l.source.fact_text)}"</div>` : ''}</div></div>`).join('')}
    <div class="small muted" style="margin-top:8px">${esc(s.placement_hint)}</div>
    ${s.warnings.map(w => `<div class="hint" style="margin-top:8px">${esc(w)}</div>`).join('')}
    ${s.excluded.length ? `<h3 style="margin-top:14px">Excluded until you approve a rewrite</h3>${s.excluded.map(e => `<label class="chk small"><input type="checkbox" class="rwchk" value="${esc(e.index)}">
      <span><span class="pill ${esc(e.status)}">${esc(e.status)}</span> "${esc(e.text)}"<br><span class="muted">Proposed wording:</span> ${esc(e.rewrite.text)}</span></label>`).join('')}
      <button id="bRewrite" style="margin-top:6px">Rebuild with approved rewrites</button>` : ''}
    <div class="small muted" style="margin-top:8px">Guard: every factual line cites a fact from the brand's site; your own experience stays a placeholder; nothing is published.</div></div>`;
}
function wireReport(o){
  const dec = async (decision) => {
    try{
      const override = !!($('#ovr') && $('#ovr').checked);
      await api(`/api/offers/${cur}/decide`, 'POST', {decision, override});
      await loadState(); await select(cur);
    }catch(e){ $('#decErr').textContent = e.message; }
  };
  if($('#bAccept')){ $('#bAccept').onclick = () => dec('accept'); $('#bCounter').onclick = () => dec('counter'); $('#bDecline').onclick = () => dec('decline'); }
  if($('#bScript')) $('#bScript').onclick = async () => {
    try{ const s = await api(`/api/offers/${cur}/script`, 'POST', {approved_rewrites: []}); $('#scriptBox').innerHTML = renderScript(s); wireScript(); }
    catch(e){ $('#scriptBox').innerHTML = `<div class="hint">${esc(e.message)}</div>`; }
  };
}
function wireScript(){
  const b = $('#bRewrite'); if(!b) return;
  b.onclick = async () => {
    const ids = [...document.querySelectorAll('.rwchk:checked')].map(x => +x.value);
    const s = await api(`/api/offers/${cur}/script`, 'POST', {approved_rewrites: ids}); $('#scriptBox').innerHTML = renderScript(s); wireScript();
  };
}
async function renderMemory(){
  const m = await api('/api/memory'); const p = m.profile;
  $('#mem').innerHTML = `<div class="card"><h2>Who you are (Creator Memory)</h2>
    <div class="small"><b>${esc(p.name)}</b> - ${esc(p.niche)} - tone: ${esc(p.tone.join(', '))}</div>
    <div class="small muted">Never promote: ${esc(p.never_promote.join(', '))}. Preferred: ${esc(p.preferred_categories.join(', '))}.</div>
    <div class="small muted">Limits: exclusivity &le; ${esc(p.norms.max_exclusivity_days)} days, Net &le; ${esc(p.norms.max_net_days)}, usage rights &le; ${esc(p.norms.max_usage_days)} days.</div></div>
    <div class="card"><div class="row spread"><h2>Your decision rules (Cedar)</h2>
      <span class="pill ${m.policy.available?'LOW':'HIGH'}">${m.policy.available?'CEDAR ACTIVE':'NOT INSTALLED'}</span></div>
      <div class="small muted">${esc(m.policy.note)} Edit <code>policies/${esc(m.policy.file)}</code> to add your own.</div>
      ${m.policy.policies.length ? m.policy.policies.map(n => `<div class="sig ok small">&#10003; ${esc(n)}</div>`).join('') : ''}</div>
    <div class="card"><div class="row spread"><h2>Decision ledger</h2>
      <span class="pill ${m.ledger_check.ok?'LOW':'HIGH'}">${m.ledger_check.ok?'CHAIN INTACT':'CHAIN BROKEN'} (${esc(m.ledger_check.entries)})</span></div>
    ${m.ledger.length ? `<table><tr><th>#</th><th>Brand</th><th>Action</th><th>Risk at the time</th><th>Note</th><th>Allowed by</th></tr>${m.ledger.map(e => `<tr><td>${esc(e.seq)}</td><td>${esc(e.brand)}</td><td>${esc(e.action)}</td><td>${esc(e.risk)}</td><td>${esc(e.note)}</td><td class="small muted">${esc(((e.policy||{}).reasons||[]).join(', '))}</td></tr>`).join('')}</table>` : '<div class="muted small">No decisions yet.</div>'}</div>
    <div class="card"><h2>Creator Trust Graph</h2><div class="small muted">Brand, claim, evidence, and what you actually said.</div>
    ${Object.keys(m.trust).length ? Object.entries(m.trust).map(([b, n]) => `<h3 style="margin-top:14px">${esc(b)} <span class="muted">${esc(n.website||'')}</span></h3>
      ${n.claims.map(c => `<div class="small"><span class="pill ${esc(c.status)}">${esc(c.status)}</span> ${esc(c.claim)}</div>`).join('')}
      ${n.creator_statements.length ? `<div class="small muted" style="margin-top:6px">You said (approved script):</div>${n.creator_statements.map(s => `<div class="small">&bull; ${esc(s.text)} ${s.source_fact?'<span class="muted">['+esc(s.source_fact)+']</span>':''}</div>`).join('')}` : ''}`).join('') : '<div class="muted small">Nothing recorded yet.</div>'}</div>`;
}
$('#tabDesk').onclick = () => { $('#desk').hidden = false; $('#mem').hidden = true; $('#tabDesk').classList.add('on'); $('#tabMem').classList.remove('on'); };
$('#tabMem').onclick = async () => { await renderMemory(); $('#desk').hidden = true; $('#mem').hidden = false; $('#tabMem').classList.add('on'); $('#tabDesk').classList.remove('on'); };
$('#btnSamples').onclick = async () => { await api('/api/samples', 'POST'); await loadState(); if(offers[0]) select(offers[0].id); };
$('#btnReset').onclick = async () => { await api('/api/reset', 'POST'); cur = offerFull = report = null; $('#desk').innerHTML = '<div class="empty">Load the sample offers, or paste one, then select it.</div>'; await loadState(); };
$('#btnAdd').onclick = async () => { const raw = $('#paste').value; if(!raw.trim()) return; const r = await api('/api/offers', 'POST', {raw}); $('#paste').value=''; await loadState(); select(r.id); };
loadState();
// ?demo=1 runs the guided demo on load, so a plain browser window can be screen-recorded
// without pasting anything into the console. ?demo=1.4 runs it slower.
(() => {
  const q = new URLSearchParams(location.search).get('demo');
  if (!q) return;
  const rate = parseFloat(q) || 1;
  window.__demoRate = rate;
  setTimeout(() => fetch('/autodemo.js').then(r => r.text()).then(src => { eval(src); }), 1200);
})();
</script>
